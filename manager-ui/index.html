<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101b1d">
  <title>作者工作台 · 万神之书</title>
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/manage/styles.css">
  <script type="module" src="/manage/app.js"></script>
</head>
<body class="manager-body">
  <a href="#workspace" class="skip-link">跳到工作台</a>
  <aside class="manager-sidebar">
    <a class="manager-brand" href="#overview"><img src="/assets/mark.svg" alt="" width="72" height="72"><strong>万神之书</strong><span>作者工作台</span></a>
    <nav class="manager-nav" aria-label="工作台导航">
      <a href="#overview" data-view="overview"><span data-icon="home"></span>总览</a>
      <a href="#games" data-view="games"><span data-icon="book"></span>游戏管理</a>
      <a href="#backups" data-view="backups"><span data-icon="folder"></span>存档备份</a>
      <a href="#logs" data-view="logs"><span data-icon="log"></span>运行日志</a>
    </nav>
    <div class="manager-local-status"><div><span>本机工作台</span><span id="connection-state" class="connection-indicator">连接中</span></div><dl><div><dt>运行时间</dt><dd id="hub-uptime">—</dd></div><div><dt>游戏进程</dt><dd id="sidebar-processes">—</dd></div></dl></div>
  </aside>
  <div class="manager-workspace" id="workspace" tabindex="-1">
    <header class="manager-heading"><div><span class="manager-eyebrow">AUTHOR'S DESK</span><h1 id="page-title">总览</h1></div><div class="manager-heading-actions"><button class="button manager-refresh" id="refresh" type="button"><span data-icon="refresh"></span><span>刷新</span></button><a class="button dark-gold" id="open-library" target="_blank" rel="noopener">打开游戏大厅 <span data-icon="external"></span></a></div></header>
    <div class="manager-metrics" id="metrics" aria-label="工作台统计"></div>
    <div class="manager-error" id="manager-error" role="alert" hidden></div>
    <main id="manager-main" aria-busy="true"><div class="initial-loading">正在连接本机游戏…</div></main>
  </div>
  <div id="manager-toast" class="toast" role="status" hidden></div>
</body>
</html>
