<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d24"><title>雅法余烬 · 夜火余账</title><link rel="stylesheet" href="style.css"></head>
<body class="in-lobby">
<section id="lobby" class="lobby">
 <div class="harbor-art"><div class="harbor-caption"><span class="eyebrow">1192 · 雅法港</span><p>海风停下之前，<br>留一盏灯给归来的人。</p></div></div>
 <div class="lobby-panel"><div class="compass-mark" aria-hidden="true">✧</div><div class="lobby-title"><span class="eyebrow">一场历史虚构冒险</span><h1>雅法余烬</h1><p>夜火余账</p></div><div class="lobby-meta"><span>六景</span><span>四人 · 三级</span><span>约 4–5 小时</span></div>
 <div class="entry-paper"><div class="entry-tabs"><button id="createTab" class="active">建立新桌</button><button id="joinTab">邀请加入</button></div>
 <form id="createRoom"><label>房间名<input id="roomName" value="夜火余账" maxlength="60" required autocomplete="off"></label><label>你的称呼<input id="hostName" value="主持人" maxlength="40" required autocomplete="nickname"></label><button class="primary wide" type="submit"><span>✧</span> 建立新桌 <span>→</span></button></form>
 <form id="joinRoom" hidden><label>邀请链接或邀请码<input id="inviteCode" required autocomplete="off"></label><label>你的称呼<input id="playerName" maxlength="40" required autocomplete="nickname"></label><button class="primary wide" type="submit">加入这一桌 <span>→</span></button></form><div id="lobbyError" class="error-message" role="alert"></div></div>
 <button id="resumeRoom" class="resume-button" hidden>继续上次的夜晚 <span>→</span></button><button id="restoreSeat" class="text-button">恢复自己的席位</button><div id="savedRooms" class="saved-rooms"></div><p class="lobby-footer">D&D 2024 · SRD 5.2.1</p></div>
</section>
<div id="gameShell" hidden>
 <header class="topbar"><button id="returnLobby" class="brand" title="返回房间入口"><span class="brand-mark">✧</span><strong>雅法余烬</strong></button><div class="room-heading"><span id="roomLabel"></span><span id="connection" class="connection">连接中</span></div><div class="top-actions"><span id="seatCount" class="muted"></span><button id="inviteBtn" class="invite-button" data-owner>邀请朋友</button><button id="roomBtn" title="房间与席位">房间</button><button id="settingsBtn" class="icon-button" title="设置与存档" aria-label="设置与存档">⚙</button></div></header>
 <main class="game-main">
  <aside class="chapter-panel"><div class="section-heading"><span class="compass-mini">✧</span><h2>这一夜</h2></div><nav id="chapterList" class="chapter-list" aria-label="六景章节"></nav><div class="chapter-bottom"><button id="bookBtn" class="wide" data-dm>主持书 <span>↗</span></button><button id="gmBtn" class="wide" data-dm>主持裁定 <span>◇</span></button><span id="saveStatus">已自动保存</span></div></aside>
  <section id="stage" class="stage"><div class="scene-heading"><div><span id="sceneNumber" class="eyebrow"></span><h1 id="sceneTitle"></h1></div><div class="scene-badges"><span id="sceneMode"></span><button id="mapInfoBtn" class="icon-button" title="地图信息" aria-label="地图信息">ⓘ</button></div></div>
   <div class="map-area"><canvas id="board" tabindex="0" aria-label="立体战术沙盘。拖动旋转和改变俯角；Shift拖动或双指平移，双指捏合或滚轮缩放。点击角色查看，点击高亮格移动；行动列表也可操作。"></canvas><div class="map-controls"><button id="zoomIn" title="放大" aria-label="放大">＋</button><button id="zoomOut" title="缩小" aria-label="缩小">−</button><button id="resetMap" title="归位视角" aria-label="归位视角">⌖</button><button id="gridBtn" class="active" title="切换网格" aria-pressed="true">格</button></div><div class="camera-controls" role="toolbar" aria-label="沙盘视角"><button id="rotateLeft" title="向左旋转" aria-label="向左旋转">↶</button><button id="rotateRight" title="向右旋转" aria-label="向右旋转">↷</button><button id="tiltUp" title="增大俯角" aria-label="增大俯角">俯＋</button><button id="tiltDown" title="减小俯角" aria-label="减小俯角">俯−</button><button id="topView" aria-pressed="false">顶视</button><button id="wallBtn" class="active" aria-pressed="true">低墙</button><button id="panMap" aria-pressed="false" title="切换单指拖动为平移">平移</button><button id="exportMesh" title="导出完整世界高度模型">OBJ ↓</button></div><div id="mapLegend" class="map-legend"></div><div id="inspect" class="inspect-card" hidden></div></div>
   <div id="initiative" class="initiative" hidden></div>
   <section id="storyCard" class="story-card"><div class="story-top"><span id="storyEyebrow" class="eyebrow">眼前的事</span><button id="journalBtn" class="text-button">查看手记 ↗</button></div><p id="objective"></p><div id="objectiveList" class="objective-list"></div><div id="choiceList" class="choice-list"></div></section>
   <div id="turnStrip" class="turn-strip"></div><div id="actionBar" class="action-bar"></div>
  </section>
  <aside id="sidePanel" class="side-panel"><div class="panel-tabs"><button class="active" data-tab="character">角色</button><button data-tab="journal">手记</button><button data-tab="table">同桌</button><button id="closeSide" class="close-side" aria-label="收起面板">×</button></div><div id="sideContent" class="side-content"></div><div class="table-feed"><div class="feed-tabs"><button class="active" data-log="story">对话</button><button data-log="dice">检定记录</button><button id="aiNav">AI 同行</button></div><div id="logPanel" class="log-panel" aria-live="polite"></div><form id="chatForm" class="chat-form"><input id="chatText" maxlength="2000" placeholder="向同桌发言…" aria-label="向同桌发言"><button type="submit" title="发送" aria-label="发送">➤</button></form><div class="dice-row"><input id="diceInput" value="1d20" aria-label="骰式"><button id="rollBtn">掷骰</button><button id="undoBtn" title="撤销上一笔" data-dm>↶</button></div></div></aside>
 </main><footer id="partyBar" class="party-bar" aria-label="队伍角色"></footer><nav class="mobile-nav" aria-label="主要面板"><button class="active" data-mobile="map">⌖<span>地图</span></button><button data-mobile="character">♙<span>角色</span></button><button data-mobile="journal">▤<span>手记</span></button><button data-mobile="table">♧<span>同桌</span></button></nav>
</div>
<div id="toast" class="toast" role="status" hidden></div><dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" class="icon-button" aria-label="关闭">×</button></div><div id="modalBody" class="modal-body"></div></dialog>
<script type="module" src="app.js"></script></body></html>
