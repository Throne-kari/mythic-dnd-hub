<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>地图工坊</title><link rel="stylesheet" href="/cartography.css"></head><body>
<header><h1>地图工坊</h1><span id="roomName"></span><a id="return" href="/">↶ 返回游戏</a></header>
<p id="message" role="status" aria-live="polite">正在读取席位…</p>
<main id="workshop" hidden>
<aside class="scenes"><h2>场景</h2><label class="mobile-select">当前场景<select id="scene"></select></label><div id="sceneList"></div><button id="blank">＋ 新建空白草稿</button><button id="original">载入原图为草稿</button><label class="file-button">导入地图 JSON<input id="import" type="file" accept=".json,application/json"></label></aside>
<section class="board"><nav id="tools" aria-label="制图工具"><button data-tool="select" class="active">↖ 选择</button><button data-tool="room">▣ 房间</button><button data-tool="wall">╱ 墙</button><button data-tool="door">⌑ 门</button><button data-tool="water">≈ 水域</button><button data-tool="terrain">♧ 地形</button><button data-tool="delete">× 删除</button></nav><div class="canvas-wrap"><canvas id="map" aria-label="5尺网格地图，点按选择物件，拖动制作；也可用右侧数字编辑"></canvas><div class="zoom"><button id="zoomIn" aria-label="放大">＋</button><button id="zoomOut" aria-label="缩小">−</button><button id="fit" aria-label="适配画面">⊙</button></div></div><div class="map-caption"><span id="mapName"></span><span>每格 5 尺</span></div></section>
<aside class="properties"><details open><summary>地图属性</summary><label>名称<input id="name" maxlength="100"></label><div class="pair"><label>宽度（尺）<input id="width_ft" type="number" min="10" max="500" step="5"></label><label>高度（尺）<input id="height_ft" type="number" min="10" max="500" step="5"></label></div><label>源依据<textarea id="provenance" rows="3" maxlength="3000"></textarea></label><div id="selection"><h3 id="selectedTitle">点按物件进行编辑</h3><label>标注<input id="label" maxlength="200"></label><div class="pair"><label>X（尺）<input id="x" type="number" step=".5"></label><label>Y（尺）<input id="y" type="number" step=".5"></label><label>宽（尺）<input id="w" type="number" min=".1" step=".5"></label><label>高（尺）<input id="h" type="number" min=".1" step=".5"></label></div><label>类型<select id="kind"><option>floor</option><option>yard</option><option>path</option><option>tree</option><option>rock</option><option>crates</option><option>cart</option><option>water</option><option>ditch</option><option>stairs</option><option>ramp</option><option>raised_platform</option><option>altar</option></select></label><label>高度（尺）<input id="height_ft" type="number" min="-500" max="500" step="1"></label><label class="check"><input id="private" type="checkbox">主持可见</label><button id="deleteSelected">删除所选物件</button></div></details><details><summary>完整场景 JSON</summary><textarea id="json" rows="15" spellcheck="false" aria-label="完整地图源JSON"></textarea><button id="applyJson">采用 JSON 修改</button></details><details><summary>导出</summary><button id="playerSvg">玩家 SVG</button><button id="playerJson">玩家 JSON</button><button id="gmJson">主持 JSON</button></details></aside>
</main><footer id="actions" hidden><div><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button><button id="cancel">取消修改</button><button id="reload">重新载入</button></div><span id="status">未载入</span><div><button id="save" class="save">保存草稿</button><button id="publish" class="primary">✓ 应用到房间</button></div></footer><script type="module" src="/cartography.js"></script></body></html>
