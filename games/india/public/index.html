<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#07313b">
 <meta name="description" content="乳海余波：甘露代价。四人印度神话冒险，独立席位、立体沙盘与房间存档。">
 <title>乳海余波：甘露代价</title>
 <link rel="stylesheet" href="style.css">
<style>.hostless-notice{margin:.65rem 0;padding:.6rem .8rem;border:1px solid currentColor;border-radius:.5rem;font-size:.82rem;line-height:1.5;opacity:.92}.hostless-notice p{margin:0}.hostless-notice button{margin-top:.5rem;max-width:100%}</style>
</head>
<body class="in-lobby" data-culture="india">
<section id="lobby" class="lobby" aria-label="房间入口">
 <div class="world-art" aria-hidden="true">
  <div class="world-orbit"></div>
  <svg class="world-landscape" viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg">
   <defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#24747b"/><stop offset="1" stop-color="#072d3a"/></linearGradient><linearGradient id="sandstone" x2="0" y2="1"><stop stop-color="#c3a16b"/><stop offset="1" stop-color="#6f6a4a"/></linearGradient></defs>
   <circle cx="452" cy="250" r="155" fill="none" stroke="#d2ab60" stroke-opacity=".25"/><circle cx="452" cy="250" r="174" fill="none" stroke="#d2ab60" stroke-opacity=".13" stroke-dasharray="1 8"/>
   <g fill="none" stroke="#d6b769" stroke-opacity=".3"><path d="M452 50q75 87 0 175-75-88 0-175Z M652 250q-87 75-175 0 88-75 175 0Z M452 450q-75-87 0-175 75 88 0 175Z M252 250q87-75 175 0-88 75-175 0Z"/><path d="M310 108q112 9 123 122-114-10-123-122Z M594 108q-9 112-122 122 10-114 122-122Z M594 392q-112-9-122-122 114 10 122 122Z M310 392q9-112 122-122-10 114-122 122Z"/></g>
   <path d="M0 540Q240 495 450 542T900 535V800H0Z" fill="url(#water)"/>
   <g fill="none" stroke="#83b9a1" stroke-opacity=".22"><path d="M0 592q225-48 450 0t450 0 M0 625q225-48 450 0t450 0 M0 666q225-48 450 0t450 0 M0 711q225-48 450 0t450 0 M0 762q225-48 450 0t450 0"/></g>
   <g fill="url(#sandstone)" stroke="#e5c681" stroke-opacity=".4"><path d="M242 473h416v32H242Z M214 512h472v28H214Z M181 547h538v28H181Z M149 583h602v29H149Z M113 620h674v29H113Z"/><path d="M322 340h256v132H322Z M304 322h292v20H304Z M331 304h238v19H331Z M357 287h186v17H357Z M381 266h138v21H381Z M402 246h96v20H402Z M422 224h56v22H422Z M444 201h13v23H444Z"/></g>
   <g fill="#183c3c" stroke="#c9ab69"><path d="M359 372q26-35 51 0v101h-51Z M435 364q24-35 47 0v109h-47Z M507 372q25-35 48 0v101h-48Z"/></g>
   <g fill="#497561" stroke="#63896d"><path d="M92 519q8-133 44-211-5 123-24 211Z"/><path d="M136 310q-83-71-131-20 80-14 131 20Z M136 310q-15-105-70-88 41 30 70 88Z M136 310q53-82 117-57-76 8-117 57Z M136 310q80-9 112 53-57-37-112-53Z M136 310q-39 37-79 89 4-71 79-89Z"/><path d="M750 462q-9-110 17-179 8 110 2 179Z"/><path d="M767 283q-65-65-105-19 61-11 105 19Z M767 283q11-91 55-81-31 28-55 81Z M767 283q66-41 111 4-59-17-111-4Z M767 283q-51 34-63 90-14-63 63-90Z"/></g>
   <g fill="#16383b" stroke="#c4aa71" stroke-width="2"><path d="M625 709q90 37 194-9l-28 37H653Z"/><path d="M713 565v144"/><path d="M719 573v115l74-12Z" fill="#d2bc87" opacity=".8"/></g>
  </svg>
 </div>
 <div class="lobby-panel">
  <div class="culture-seal" aria-hidden="true">✧</div>
  <div class="lobby-title"><span class="eyebrow">一场神话冒险</span><h1>乳海余波</h1><p>甘露代价</p></div>
  <div class="lobby-meta"><span>四人同桌</span><span>固定三级</span><span>独立席位</span></div>
  <div class="entry-paper">
   <div class="entry-tabs"><button id="createTab" class="active" type="button">建立新桌</button><button id="joinTab" type="button">邀请加入</button></div>
   <form id="createRoom"><label>房间名<input id="roomName" value="甘露代价" maxlength="60" required autocomplete="off"></label><label>你的称呼<input id="hostName" value="同行者" maxlength="40" required autocomplete="nickname"></label><button class="primary wide" type="submit"><span>◇</span>建立新桌<span>→</span></button></form>
   <form id="joinRoom" hidden><label>邀请链接或邀请码<input id="inviteCode" required autocomplete="off"></label><label>你的称呼<input id="playerName" maxlength="40" required autocomplete="nickname"></label><button class="primary wide" type="submit">加入这一桌<span>→</span></button></form>
   <div id="lobbyError" class="error-message" role="alert"></div>
  </div>
  <button id="resumeRoom" class="resume-button" hidden>继续上次的旅途<span>→</span></button>
  <button id="restoreSeat" class="text-button">恢复自己的席位</button>
  <div id="savedRooms" class="saved-rooms"></div>
  <div class="lobby-tools"><button id="lobbyRules" data-rules-open type="button">▤ 游戏规则</button><button id="lobbySoundToggle" data-sound-toggle aria-pressed="false" type="button">声音 · 关闭</button></div>
  <p class="lobby-footer">D&D 2024 · SRD 5.2.1</p>
 </div>
</section>
<div id="gameShell" hidden>
 <header class="topbar">
  <button id="returnLobby" class="brand" title="返回房间入口"><span class="brand-mark" aria-hidden="true">✧</span><span><strong>乳海余波</strong><small>甘露代价</small></span></button>
  <div class="room-heading"><span id="roomLabel"></span><span id="connection" class="connection">连接中</span></div>
  <div class="top-actions"><span id="seatCount" class="muted"></span><button id="inviteBtn" class="invite-button" data-owner>邀请朋友</button><button id="roomBtn" title="房间与席位">同桌</button><button id="soundToggle" data-sound-toggle aria-pressed="false" title="点击启用环境声与反馈音">声音 · 关闭</button><button id="rulesOpen" data-rules-open>规则</button><button id="settingsBtn" class="icon-button" title="设置与存档" aria-label="设置与存档">⚙</button></div>
 </header>
 <main class="game-main">
  <aside class="left-rail" aria-label="队伍与章节">
   <div class="rail-heading"><span>共同的旅人</span><span class="rail-symbol" aria-hidden="true">◇</span></div>
   <div id="partyBar" class="party-bar" aria-label="队伍角色"></div>
   <section class="chapter-panel"><div class="section-heading"><h2>海岸行记</h2><span aria-hidden="true">▤</span></div><nav id="chapterList" class="chapter-list" aria-label="冒险章节"></nav></section><div class="chapter-bottom"><button id="bookBtn" class="wide" data-dm>主持书<span>↗</span></button><button id="gmBtn" class="wide" data-dm>主持裁定<span>◇</span></button><span id="saveStatus">已自动保存</span></div>
  </aside>
  <section id="stage" class="stage" aria-label="立体地图与行动">
   <div class="scene-heading"><div><span id="sceneNumber" class="eyebrow"></span><h1 id="sceneTitle"></h1></div><div class="scene-badges"><span id="sceneMode"></span><button id="mapInfoBtn" class="icon-button" title="地图信息" aria-label="地图信息">ⓘ</button></div></div>
   <div class="map-area"><canvas id="board" tabindex="0" aria-label="立体战术沙盘。拖动旋转和改变俯角；Shift拖动或双指平移，双指捏合或滚轮缩放。点击角色查看，点击高亮格移动；行动列表也可操作。"></canvas>
    <div class="map-controls" role="toolbar" aria-label="地图缩放"><button id="zoomIn" title="放大" aria-label="放大">＋</button><button id="zoomOut" title="缩小" aria-label="缩小">−</button><button id="resetMap" title="归位视角" aria-label="归位视角">⌖</button><button id="gridBtn" class="active" title="切换网格" aria-pressed="true">格</button></div>
    <div class="camera-controls" role="toolbar" aria-label="沙盘视角"><button id="rotateLeft" title="向左旋转" aria-label="向左旋转">↶</button><button id="rotateRight" title="向右旋转" aria-label="向右旋转">↷</button><button id="tiltUp" title="增大俯角" aria-label="增大俯角">俯＋</button><button id="tiltDown" title="减小俯角" aria-label="减小俯角">俯−</button><button id="topView" aria-pressed="false">顶视</button><button id="wallBtn" class="active" aria-pressed="true" title="低墙剖视与完整高度切换">剖视</button><button id="panMap" aria-pressed="false" title="切换单指拖动为平移">平移</button><button id="exportMesh" title="导出完整世界高度模型">模型 ↓</button></div>
    <div id="mapLegend" class="map-legend"></div><div id="inspect" class="inspect-card" hidden></div>
   </div>
   <div id="initiative" class="initiative" hidden></div><div id="turnStrip" class="turn-strip"></div><div id="actionBar" class="action-bar"></div>
  </section>
  <div class="story-panel">
   <section id="storyCard" class="story-card" aria-label="当前剧情与选择"><div class="story-ornament" aria-hidden="true">❋</div><div class="story-top"><span id="storyEyebrow" class="eyebrow">眼前的事</span><button id="journalBtn" class="text-button">手记 ↗</button></div><p id="objective"></p><div id="objectiveList" class="objective-list"></div><div id="choiceList" class="choice-list"></div></section>
   <aside id="sidePanel" class="side-panel"><div class="panel-tabs"><button class="active" data-tab="character">角色</button><button data-tab="journal">手记</button><button data-tab="table">同桌</button><button id="closeSide" class="close-side" aria-label="收起面板">×</button></div><div id="sideContent" class="side-content"></div><div class="table-feed"><div class="feed-tabs"><button class="active" data-log="story">对话</button><button data-log="dice">检定</button><button id="aiNav">AI 同行</button></div><div id="logPanel" class="log-panel" aria-live="polite"></div><form id="chatForm" class="chat-form"><input id="chatText" maxlength="2000" placeholder="向同桌发言…" aria-label="向同桌发言"><button type="submit" title="发送" aria-label="发送">➤</button></form><div class="dice-row"><input id="diceInput" value="1d20" aria-label="骰式"><button id="rollBtn">掷骰</button><button id="undoBtn" title="撤销上一笔" data-dm>↶</button></div></div></aside>
  </div>
 </main>
 <nav class="mobile-nav" aria-label="主要面板"><button class="active" data-mobile="map">⌖<span>地图</span></button><button data-mobile="character">♙<span>角色</span></button><button id="mobileActions">◇<span>行动</span></button><button data-mobile="journal">▤<span>手记</span></button><button data-mobile="table">♧<span>同桌</span></button><button id="mobileRules" data-rules-open>▥<span>规则</span></button></nav>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<dialog id="modal"><div class="modal-head"><h2 id="modalTitle"></h2><button id="closeModal" class="icon-button" aria-label="关闭">×</button></div><div id="modalBody" class="modal-body"></div></dialog>
<script type="module" src="audio.js"></script><script type="module" src="app.js"></script>
</body>
</html>
